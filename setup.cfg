[metadata]
name = weaviate-client
description = A python native Weaviate client
long_description = file: README.rst
long_description_content_type = text/x-rst; charset=UTF-8
url = https://github.com/weaviate/weaviate-python-client
author = Weaviate
author_email = hello@weaviate.io,
license_files = LICENSE
license = BSD 3-clause
project_urls =
    Documentation = https://weaviate-python-client.readthedocs.io
    Source = https://github.com/weaviate/weaviate-python-client
    Tracker = https://github.com/weaviate/weaviate-python-client/issues
dynamic = ["version"]

[options]
zip_safe = False
packages =
    weaviate
    weaviate.backup
    weaviate.classes
    weaviate.cluster
    weaviate.collections
    weaviate.connect
    weaviate.debug
    weaviate.gql
    weaviate.outputs
    weaviate.proto
    weaviate.proto.v1
    weaviate.rbac
    weaviate.users

platforms = any
include_package_data = True
install_requires =
    # httpx2 2.15+ needs Python 3.11; on 3.10 pip resolves 2.12-2.14.
    httpx2>=2.12.0,<3.0.0
    # CA bundle for both REST (via httpx2) and gRPC. 2026.10.19 drops the emSign ECC
    # Root CA - G3, whose intermediates' private keys were compromised in October 2026.
    certifi>=2026.10.19
    validators>=0.34.0,<1.0.0
    # 1.8 is the first authlib whose httpx_client integration is built on httpx2.
    authlib>=1.8.0,<2.0.0
    pydantic>=2.12.0,<3.0.0
    grpcio>=1.59.5,<1.80.0; sys_platform != "emscripten"
    protobuf>=4.21.6,<7.0.0
    packaging>=21.0
python_requires = >=3.10

[options.extras_require]
agents =
    weaviate-agents >=1.0.0, <2.0.0
    # weaviate-agents imports httpx without declaring it and used to get it through this
    # package. Drop once weaviate-agents depends on httpx (or httpx2) itself.
    httpx >=0.26.0, <0.29.0
grpc-web =
    # The Pyodide/WASM grpc-web companion, built from packages/web in this repo. Both
    # packages derive their version from the same git tag (setuptools_scm; CI asserts
    # the built wheels match). The marker makes the extra a no-op on CPython: the
    # companion imports pyodide at module scope and only makes sense under Emscripten.
    weaviate-client-web; sys_platform == "emscripten"

[options.package_data]
# If any package or subpackage contains *.txt, *.rst or *.md files, include them:
*: ["*.txt", "*.rst", "*.md", LICENSE],
