[build-system]
requires = ["setuptools>=65", "setuptools_scm[toml] >6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weaviate-client-web"
description = "grpc-web and fetch transports for the Weaviate Python client under Pyodide"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Weaviate", email = "hello@weaviate.io" }]
keywords = ["weaviate", "grpc-web", "pyodide", "wasm", "emscripten"]
# version: git tags (setuptools_scm); dependencies: setup.py (lockstep weaviate-client pin)
dynamic = ["version", "dependencies"]

[project.urls]
Source = "https://github.com/weaviate/weaviate-python-client"
Tracker = "https://github.com/weaviate/weaviate-python-client/issues"

[tool.setuptools_scm]
root = "../.."

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weaviate_client_web = ["py.typed"]
